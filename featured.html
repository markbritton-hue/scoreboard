<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Featured Score Overlay</title>
<style>
  :root {
    --panel-bg: #3a3a3a;        /* not near-black: avoids luma/chroma-key engines (e.g. H2R) that treat dark pixels as transparent */
    --panel-edge: #c9a227;
    --ink: #f3f1e6;
    --ink-dim: #a9b6a3;
    --font-display: 'Oswald', Arial Narrow, sans-serif;
    --font-score: 'Teko', Arial, sans-serif;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;   /* critical: OBS Browser Source / H2R transparency */
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  * { box-sizing: border-box; }

  #card {
    position: fixed;
    right: 32px;
    top: 50%;
    transform: translateY(-50%);
    width: 340px;
    background: var(--panel-bg);
    border: 4px solid var(--panel-edge);
    border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.55);
    font-family: var(--font-display);
    color: var(--ink);
    overflow: hidden;
  }

  #card[hidden] { display: none; }

  #note {
    padding: 8px 16px;
    background: rgba(0,0,0,0.25);
    border-bottom: 2px solid rgba(201,162,39,0.5);
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-dim);
    text-align: center;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
  }

  .row + .row { border-top: 1px solid rgba(255,255,255,0.25); }

  .logo {
    width: 64px;
    height: 64px;
    object-fit: contain;
    flex: 0 0 auto;
    background: #fff;
    border-radius: 8px;
    padding: 3px;
  }

  .logo.monogram {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-score);
    font-size: 34px;
    font-weight: 600;
    color: #333;
    padding: 0;
  }

  .team {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 24px;
    font-weight: 500;
    line-height: 1.15;
  }

  .score {
    font-family: var(--font-score);
    font-size: 58px;
    font-weight: 600;
    min-width: 56px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .winner .team, .winner .score { color: #ffd76a; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Teko:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

<div id="card" hidden>
  <div id="note"></div>
  <div class="row" id="home"></div>
  <div class="row" id="away"></div>
</div>

<script src="core.js"></script>
<script>
  const REFRESH_MS = 20 * 1000;
  let CFG = SB.DEFAULTS;
  let LOGOS = {};
  let current = { id: null, date: null };  // the game on screen; changed by the setup page
  let lastSig = null;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function rowHtml(side, won) {
    const src = LOGOS[side.team.trim().toLowerCase()];
    const tile = src
      ? `<img class="logo" src="${escapeHtml(src)}" alt="">`
      : `<span class="logo monogram">${escapeHtml(side.team.trim().charAt(0).toUpperCase())}</span>`;
    return `${tile}<span class="team">${escapeHtml(side.team)}</span><span class="score">${side.score ?? "&ndash;"}</span>`;
  }

  function show(game) {
    const card = document.getElementById("card");
    if (!game) { lastSig = null; card.hidden = true; return; }
    const sig = JSON.stringify([game.home, game.away, game.note]);
    if (sig === lastSig) return;  // unchanged: leave the card alone
    lastSig = sig;
    const h = game.home.score === null ? null : Number(game.home.score);
    const a = game.away.score === null ? null : Number(game.away.score);
    document.getElementById("note").textContent = game.note;
    document.getElementById("home").innerHTML = rowHtml(game.home);
    document.getElementById("away").innerHTML = rowHtml(game.away);
    document.getElementById("home").classList.toggle("winner", h !== null && a !== null && h > a);
    document.getElementById("away").classList.toggle("winner", h !== null && a !== null && a > h);
    card.hidden = false;
  }

  async function refresh() {
    if (!current.id) return show(null);
    try {
      const cfg = { ...CFG, date: current.date };
      const { games } = await SB.fetchMhsaaGames(cfg, await SB.trackedSchools(cfg));
      show(games.find(g => g.id === current.id) || null);
    } catch (err) {
      console.error("Featured score fetch failed:", err);  // keep whatever is on screen
    }
  }

  function setCurrent(id, date) {
    current = { id: id || null, date: date || null };
    lastSig = null;
    refresh();
  }

  // The setup page tells this page which game to show when both are open in the same browser.
  try {
    const channel = new BroadcastChannel("scoreboard-featured");
    channel.onmessage = e => setCurrent(e.data.id, e.data.date);
  } catch (e) {}
  window.addEventListener("storage", e => {
    if (e.key !== "scoreboard-featured" || !e.newValue) return;
    const v = JSON.parse(e.newValue);
    setCurrent(v.id, v.date);
  });

  (async function init() {
    try {
      CFG = await SB.loadConfig();
      LOGOS = await SB.loadLogos(CFG);
    } catch (e) { console.error(e); }
    setCurrent(CFG.featured, CFG.featuredDate);
    setInterval(refresh, REFRESH_MS);
  })();
</script>

</body>
</html>
